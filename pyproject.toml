[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlpp-embedding"
version = "0.1.0"
description = "Time-lagged phase portrait embeddings and variational autoencoders"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "torch"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tlpp_embedding*"]
